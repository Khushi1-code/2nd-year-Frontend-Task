<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <script>
        for(let i=2; i<=5; i++){
            document.write("Table of " + i + "<br>");
            for(let j=1; j<=10; j++){
                let m = i*j;
                document.write(i + "X" + j + "=" + m + "<br>");
            }
            document.write("<br>");
        }
    </script>
</body>
</html>
