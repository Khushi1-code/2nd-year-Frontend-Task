<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Numbers</title>
</head>
<body>
    <h2>Prime Numbers b/w 1 and 100</h2>
    <script>
        for(let i=1; i<=100; i++){
            flag=true;
            for(let j=2; j*j<=i; j++){
                if(i%j==0){
                    flag=false;
                    break;
                } 
            }
            if(flag){
                document.write(i+"<br>");
            }
        }
    </script>
</body>
</html>
