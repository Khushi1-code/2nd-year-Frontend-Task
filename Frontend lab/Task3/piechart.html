<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Languages</title>
</head>
<style>
   .pie{
    border: 3px solid orange;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: conic-gradient(yellow 0deg, yellow 40deg, lightblue 40deg, lightblue 95deg, pink 95deg, pink 170deg, lightgreen 170deg, lightgreen 280deg, violet 280deg, violet 360deg );
   }
   .one{
    position: relative;
    bottom: 180px;
    left: 40px
   }
   .two{
    position: relative;
    bottom: 135px;
    left: 40px
   }
   .three{
    position: relative;
    bottom: 170px;
    left: 123px
   }
   .four{
    position: relative;
    bottom: 310px;
    left: 115px
   }
</style>
<body>
    <h1><u>Programming Languages Popularity</u></h1>
   <div class="pie"></div>
   <h3 class="one">C++</h3>
   <h3 class="two">Java</h3>
   <h4 class="three">Python</h4>
   <h4 class="four">C</h4>
   <h4></h4>
</body>
</html>
